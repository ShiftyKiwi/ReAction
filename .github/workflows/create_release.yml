name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ReAction.sln --locked-mode

      - name: Build
        run: dotnet build ReAction.sln -c Release --no-restore

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content .\bin\Release\ReAction.json | ConvertFrom-Json
          $expectedTag = "v$($manifest.AssemblyVersion)"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match manifest version $expectedTag."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\bin\Release\ReAction\latest.zip#latest.zip" `
            ".\bin\Release\ReAction.json#ReAction.json" `
            --repo "${{ github.repository }}" `
            --generate-notes `
            --title "${{ github.ref_name }}"
